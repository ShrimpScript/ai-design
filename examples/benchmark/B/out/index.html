<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watering Can</title>
<meta name="description" content="Keep track of when each of your houseplants needs water.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
  Design plan
  Color: mist #EEF1EC (page), sheet #FFFFFF, ink #1E2B24, water #2E6BD6 (the one loud color),
         dry #A86A12 (overdue soil), leaf #3F6B4B (healthy), rule #D5DCD3
  Type:  Young Serif for plant names + the day headline (feels like a hand-lettered plant label);
         Schibsted Grotesk for everything functional.
  Layout: one left-aligned column. Headline sentence built from today's data, then the plants that
          need water, a 14-day strip, then every plant ordered by next watering.
  Signature: every plant has a small pot whose water level drains day by day; watering refills it.
*/
:root{
  --mist:#EEF1EC; --sheet:#FFFFFF; --ink:#1E2B24; --ink-2:#56645C; --rule:#D5DCD3;
  --water:#2E6BD6; --water-soft:#DCE7FA; --dry:#A86A12; --dry-soft:#F5E8D2; --leaf:#3F6B4B;
  --soil:#6B5443; --pot:#C9CFC6; --focus:#2E6BD6;
  --serif:"Young Serif", Georgia, serif;
  --sans:"Schibsted Grotesk", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --mist:#141A17; --sheet:#1C2420; --ink:#E6ECE7; --ink-2:#A2B0A7; --rule:#2F3A34;
    --water:#6D9BEE; --water-soft:#1F2E4A; --dry:#E0A64A; --dry-soft:#3A2D18; --leaf:#8DBB98;
    --soil:#8D735F; --pot:#3A4540; --focus:#8DB3F5;
  }
}
:root[data-theme="dark"]{
  --mist:#141A17; --sheet:#1C2420; --ink:#E6ECE7; --ink-2:#A2B0A7; --rule:#2F3A34;
  --water:#6D9BEE; --water-soft:#1F2E4A; --dry:#E0A64A; --dry-soft:#3A2D18; --leaf:#8DBB98;
  --soil:#8D735F; --pot:#3A4540; --focus:#8DB3F5;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mist);color:var(--ink);font:400 16px/1.5 var(--sans);}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}

.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0 8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1rem}
.brand svg{width:26px;height:26px;color:var(--water)}

.btn{appearance:none;border:0;cursor:pointer;border-radius:999px;padding:10px 18px;font-weight:600;font-size:.95rem;line-height:1.2}
.btn-primary{background:var(--water);color:#fff}
[data-theme="dark"] .btn-primary{color:#0E1A2E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-primary{color:#0E1A2E}}
.btn-primary:hover{filter:brightness(1.07)}
.btn-quiet{background:transparent;color:var(--ink-2);padding:8px 12px}
.btn-quiet:hover{color:var(--ink);background:var(--rule)}
.btn-line{background:transparent;border:1.5px solid var(--rule);color:var(--ink)}
.btn-line:hover{border-color:var(--ink-2)}

/* Headline */
.today{padding:40px 0 28px}
.today .date{color:var(--ink-2);font-size:1rem;margin:0 0 8px}
.today h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.1rem,6.4vw,3.6rem);line-height:1.08;letter-spacing:-.01em;margin:0;max-width:16ch;text-wrap:balance}
.today p.sub{margin:14px 0 0;color:var(--ink-2);max-width:52ch}

/* Section headings */
h2{font-family:var(--sans);font-size:1.125rem;font-weight:600;margin:0}
.sec{margin-top:36px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-head .hint{color:var(--ink-2);font-size:.9rem}

/* Plant rows */
.plants{list-style:none;margin:0;padding:0;background:var(--sheet);border-radius:18px;border:1px solid var(--rule);overflow:hidden}
.plant{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:16px;padding:14px 16px 14px 14px;border-top:1px solid var(--rule)}
.plant:first-child{border-top:0}
.pot{width:52px;height:56px;display:block}
.pot .water{transition:y .9s cubic-bezier(.2,.8,.2,1),height .9s cubic-bezier(.2,.8,.2,1)}
.p-main{min-width:0}
.p-name{font-family:var(--serif);font-size:1.28rem;line-height:1.2;margin:0;overflow-wrap:anywhere}
.p-meta{color:var(--ink-2);font-size:.9rem;margin-top:2px}
.p-status{font-weight:600;font-size:.9rem;margin-top:4px}
.s-over{color:var(--dry)}
.s-today{color:var(--water)}
.s-soon{color:var(--ink)}
.s-fine{color:var(--leaf)}
.p-actions{display:flex;align-items:center;gap:4px}
.water-btn{background:var(--water-soft);color:var(--water);border-radius:999px;border:0;padding:9px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.water-btn:hover{background:var(--water);color:var(--sheet)}
.icon-btn{border:0;background:transparent;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);cursor:pointer}
.icon-btn:hover{background:var(--mist);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.plant.is-over{background:linear-gradient(to right,var(--dry-soft),transparent 55%)}

.empty{background:var(--sheet);border:1.5px dashed var(--rule);border-radius:18px;padding:28px 20px;color:var(--ink-2)}
.empty strong{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}
.empty .btn{margin-top:14px}

/* 14 day strip */
.strip{display:grid;grid-template-columns:repeat(14,minmax(64px,1fr));gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.day{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:8px 8px 10px;min-height:112px;display:flex;flex-direction:column;gap:6px}
.day.is-today{border-color:var(--water);box-shadow:inset 0 0 0 1px var(--water)}
.day-h{font-size:.78rem;color:var(--ink-2);line-height:1.2}
.day-h b{display:block;font-size:1.05rem;color:var(--ink);font-weight:600}
.drop{font-size:.78rem;line-height:1.2;background:var(--water-soft);color:var(--ink);border-radius:6px;padding:4px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop.over{background:var(--dry-soft)}

/* Controls */
.controls{display:flex;gap:8px;flex-wrap:wrap}
select.sort{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:.9rem}

/* Dialog */
dialog{border:0;border-radius:20px;padding:0;background:var(--sheet);color:var(--ink);width:min(460px,calc(100vw - 32px));box-shadow:0 24px 60px rgba(20,30,25,.28)}
dialog::backdrop{background:rgba(20,30,25,.45)}
.dlg{padding:24px}
.dlg h3{font-family:var(--serif);font-weight:400;font-size:1.6rem;margin:0 0 18px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-weight:500;font-size:.92rem;margin-bottom:6px}
.field small{display:block;color:var(--ink-2);font-size:.82rem;margin-top:4px}
.field input,.field textarea{width:100%;border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--mist)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--water);background:var(--sheet)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.presets button{border:1.5px solid var(--rule);background:transparent;border-radius:999px;padding:4px 10px;font-size:.82rem;cursor:pointer;color:var(--ink-2)}
.presets button[aria-pressed="true"]{border-color:var(--water);color:var(--water);background:var(--water-soft)}
.dlg-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:22px}
.dlg-foot .right{display:flex;gap:8px;margin-left:auto}
.danger{color:var(--dry)}
.err{color:var(--dry);font-size:.85rem;margin-top:4px;min-height:1em}
.history{margin:4px 0 0;padding:0;list-style:none;color:var(--ink-2);font-size:.88rem;display:flex;flex-wrap:wrap;gap:6px}
.history li{background:var(--mist);border-radius:6px;padding:2px 8px}

/* Toast */
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,140%);background:var(--ink);color:var(--mist);border-radius:14px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:transform .25s ease;max-width:calc(100vw - 32px);z-index:10}
.toast.show{transform:translate(-50%,0)}
.toast button{background:transparent;border:0;color:var(--mist);font-weight:700;text-decoration:underline;cursor:pointer;padding:6px 8px}

footer.foot{margin-top:48px;color:var(--ink-2);font-size:.85rem;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
footer.foot button{font-size:.85rem}

@media (max-width:560px){
  .plant{grid-template-columns:44px 1fr;gap:12px;padding:14px 12px}
  .pot{width:44px;height:48px}
  .p-actions{grid-column:1 / -1;justify-content:flex-end;margin-top:-4px}
  .today{padding-top:28px}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12h14l-1.5 13h-11z"/><path d="M21 15l7-6"/><path d="M26 7l3 3"/><path d="M9 12a5 5 0 0 1 10 0"/></svg>
      Watering Can
    </div>
    <button class="btn btn-primary" id="addBtn">Add plant</button>
  </header>

  <section class="today" aria-live="polite">
    <p class="date" id="dateLine"></p>
    <h1 id="headline"></h1>
    <p class="sub" id="subline"></p>
  </section>

  <section class="sec" id="dueSec" aria-labelledby="dueH">
    <div class="sec-head"><h2 id="dueH">Water today</h2><span class="hint" id="dueHint"></span></div>
    <ul class="plants" id="dueList"></ul>
  </section>

  <section class="sec" id="stripSec" aria-labelledby="stripH">
    <div class="sec-head"><h2 id="stripH">Next two weeks</h2></div>
    <div class="strip" id="strip" tabindex="0" aria-label="Watering calendar for the next 14 days"></div>
  </section>

  <section class="sec" aria-labelledby="allH">
    <div class="sec-head">
      <h2 id="allH">All plants</h2>
      <label class="controls"><span class="sr">Sort plants</span>
        <select class="sort" id="sortSel">
          <option value="next">By next watering</option>
          <option value="name">By name</option>
          <option value="place">By room</option>
        </select>
      </label>
    </div>
    <ul class="plants" id="allList"></ul>
  </section>

  <footer class="foot">
    <span>Saved in this browser only.</span>
    <button class="btn btn-quiet" id="exportBtn">Export plants</button>
    <button class="btn btn-quiet" id="importBtn">Import plants</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </footer>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form class="dlg" id="form" method="dialog" novalidate>
    <h3 id="dlgTitle">Add a plant</h3>
    <label class="field"><span>Name</span>
      <input id="fName" autocomplete="off" placeholder="Monstera by the window" required maxlength="60">
      <div class="err" id="nameErr"></div>
    </label>
    <label class="field"><span>Room</span>
      <input id="fPlace" autocomplete="off" placeholder="Living room" maxlength="40" list="rooms">
      <datalist id="rooms"></datalist>
    </label>
    <div class="row2">
      <label class="field"><span>Water every</span>
        <input id="fEvery" type="number" min="1" max="120" inputmode="numeric" required>
        <small>days</small>
      </label>
      <label class="field"><span>Last watered</span>
        <input id="fLast" type="date" required>
      </label>
    </div>
    <div class="presets" id="presets" role="group" aria-label="Common schedules">
      <button type="button" data-d="3">Ferns, 3 days</button>
      <button type="button" data-d="7">Most leafy plants, 7</button>
      <button type="button" data-d="14">Snake plant, 14</button>
      <button type="button" data-d="21">Cacti, 21</button>
    </div>
    <label class="field" style="margin-top:14px"><span>Notes</span>
      <input id="fNote" autocomplete="off" placeholder="Let top inch of soil dry out" maxlength="100">
    </label>
    <div id="histWrap" hidden>
      <span style="font-weight:500;font-size:.92rem">Recent waterings</span>
      <ul class="history" id="hist"></ul>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn btn-quiet danger" id="delBtn" hidden>Remove plant</button>
      <div class="right">
        <button type="button" class="btn btn-line" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Add plant</button>
      </div>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" type="button">Undo</button></div>

<script>
(() => {
  const KEY = 'watering-can.v1';
  const $ = s => document.querySelector(s);
  const DAY = 86400000;

  // ---- dates (local calendar days) ----
  const iso = d => { const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; };
  const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  const todayD = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
  const diff = (a, b) => Math.round((a - b) / DAY);
  const fmtLong = d => d.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});
  const fmtShort = d => d.toLocaleDateString(undefined, {month:'short', day:'numeric'});

  // ---- storage ----
  let plants = [];
  function seed(){
    const t = todayD();
    const mk = (name, place, every, ago, note='') => ({ id: crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2), name, place, every, last: iso(addDays(t,-ago)), note, history: [iso(addDays(t,-ago)), iso(addDays(t,-ago-every))] });
    return [
      mk('Monstera', 'Living room', 7, 9, 'Water when top 2 cm of soil is dry'),
      mk('Maidenhair fern', 'Bathroom', 3, 3, 'Never let it dry out'),
      mk('Pothos', 'Kitchen shelf', 7, 4),
      mk('Snake plant', 'Bedroom', 14, 6),
      mk('Fiddle leaf fig', 'Living room', 8, 7),
      mk('Golden barrel cactus', 'Windowsill', 21, 12),
    ];
  }
  function load(){
    try { const raw = localStorage.getItem(KEY); if (raw) { const p = JSON.parse(raw); if (Array.isArray(p)) return p; } } catch(e){}
    return null;
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(plants)); } catch(e){} }
  plants = load() ?? seed();
  save();

  // ---- derived ----
  function info(p){
    const t = todayD();
    const due = addDays(parse(p.last), p.every);
    const left = diff(due, t);
    const level = Math.max(0, Math.min(1, left / p.every));
    let cls, text;
    if (left < 0) { cls='over'; text = left === -1 ? '1 day overdue' : `${-left} days overdue`; }
    else if (left === 0) { cls='today'; text='Due today'; }
    else if (left === 1) { cls='soon'; text='Due tomorrow'; }
    else if (left <= 3) { cls='soon'; text=`Due in ${left} days`; }
    else { cls='fine'; text=`Next on ${due.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'})}`; }
    const ago = diff(t, parse(p.last));
    const agoText = ago === 0 ? 'watered today' : ago === 1 ? 'watered yesterday' : `watered ${ago} days ago`;
    return { due, left, level, cls, text, agoText };
  }

  // ---- pot svg ----
  function pot(level, over, id){
    // inner cavity from y=14 to y=50 (height 36)
    const h = Math.round(36 * level);
    const y = 50 - h;
    const soilColor = over ? 'var(--dry)' : 'var(--soil)';
    return `<svg class="pot" viewBox="0 0 52 56" aria-hidden="true">
      <defs><clipPath id="c${id}"><path d="M9 12h34l-4 40H13z"/></clipPath></defs>
      <path d="M9 12h34l-4 40H13z" fill="var(--mist)"/>
      <g clip-path="url(#c${id})">
        <rect class="water" x="0" y="${y}" width="52" height="${h+4}" fill="var(--water)" opacity=".85"/>
        <rect x="0" y="12" width="52" height="4" fill="${soilColor}" opacity="${over ? .9 : .55}"/>
      </g>
      <path d="M9 12h34l-4 40H13z" fill="none" stroke="var(--ink-2)" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="6" y="8" width="40" height="5" rx="1.5" fill="var(--pot)" stroke="var(--ink-2)" stroke-width="1.6"/>
      ${over ? '' : `<path d="M26 8c0-5 3-7 7-7-0 4-3 7-7 7zM26 8c0-4-2-6-6-6 0 3 2 6 6 6z" fill="var(--leaf)"/>`}
      ${over ? `<path d="M26 8c0-4 2-6 5-5-1 3-3 5-5 5zM26 8c-1-3-3-4-6-3 1 2 3 3 6 3z" fill="var(--dry)"/>` : ''}
    </svg>`;
  }

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function row(p){
    const i = info(p);
    const metaBits = [p.place, i.agoText].filter(Boolean).map(esc);
    return `<li class="plant ${i.cls==='over'?'is-over':''}" data-id="${p.id}">
      ${pot(i.level, i.cls==='over', p.id)}
      <div class="p-main">
        <p class="p-name">${esc(p.name)}</p>
        <div class="p-meta">${metaBits.join(', ')}${p.note ? `<br>${esc(p.note)}` : ''}</div>
        <div class="p-status s-${i.cls}">${i.text}</div>
      </div>
      <div class="p-actions">
        <button class="water-btn" data-act="water" aria-label="Water ${esc(p.name)}">Water</button>
        <button class="icon-btn" data-act="edit" aria-label="Edit ${esc(p.name)}" title="Edit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
        </button>
      </div>
    </li>`;
  }

  const words = ['No','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'];
  const num = n => n <= 10 ? words[n] : String(n);

  function render(){
    const t = todayD();
    $('#dateLine').textContent = fmtLong(t);
    const withInfo = plants.map(p => ({p, i: info(p)}));
    const due = withInfo.filter(x => x.i.left <= 0).sort((a,b) => a.i.left - b.i.left);
    const over = due.filter(x => x.i.left < 0).length;

    // headline
    if (!plants.length){
      $('#headline').textContent = 'Add your first plant to start a schedule.';
      $('#subline').textContent = 'Tell us how often it likes water and when it last had some. We’ll show you when it’s due next.';
    } else if (!due.length){
      const next = withInfo.slice().sort((a,b)=>a.i.left-b.i.left)[0];
      $('#headline').textContent = 'Nothing needs water today.';
      $('#subline').textContent = `${next.p.name} is next, ${next.i.left===1?'tomorrow':'in '+next.i.left+' days'}.`;
    } else {
      $('#headline').textContent = `${num(due.length)} ${due.length===1?'plant needs':'plants need'} water today.`;
      $('#subline').textContent = !over ? 'Everything else is on schedule.'
        : over === due.length ? (over === 1 ? 'It’s already overdue, so don’t wait on this one.' : 'All of them are overdue, so start with the driest pot.')
        : `${num(over)} ${over===1?'is':'are'} already overdue. Water ${over===1?'that one':'those'} first.`;
    }

    // due list
    $('#dueSec').hidden = !due.length;
    $('#dueList').innerHTML = due.map(x => row(x.p)).join('');
    $('#dueHint').textContent = due.length ? 'Most overdue first' : '';

    // strip
    $('#stripSec').hidden = !plants.length;
    let strip = '';
    for (let d = 0; d < 14; d++){
      const day = addDays(t, d);
      const items = withInfo.filter(x => {
        if (d === 0) return x.i.left <= 0;
        // project repeat cycles within window
        if (x.i.left <= 0) return d % x.p.every === 0;
        return d >= x.i.left && (d - x.i.left) % x.p.every === 0;
      });
      const wd = d === 0 ? 'Today' : day.toLocaleDateString(undefined,{weekday:'short'});
      strip += `<div class="day ${d===0?'is-today':''}"><div class="day-h">${wd}<b>${day.getDate()}</b></div>
        ${items.map(x => `<div class="drop ${d===0 && x.i.left<0 ? 'over':''}" title="${esc(x.p.name)}">${esc(x.p.name)}</div>`).join('')}</div>`;
    }
    $('#strip').innerHTML = strip;

    // all list
    const mode = $('#sortSel').value;
    const all = withInfo.slice().sort((a,b) => {
      if (mode === 'name') return a.p.name.localeCompare(b.p.name);
      if (mode === 'place') return (a.p.place||'~').localeCompare(b.p.place||'~') || a.i.left - b.i.left;
      return a.i.left - b.i.left || a.p.name.localeCompare(b.p.name);
    });
    $('#allList').innerHTML = all.length ? all.map(x => row(x.p)).join('') : '';
    $('#allList').hidden = !all.length;
    let emptyEl = $('#emptyAll');
    if (!all.length && !emptyEl){
      $('#allList').insertAdjacentHTML('afterend', `<div class="empty" id="emptyAll"><strong>No plants yet</strong>Add a plant with how often it needs water, and it will show up here with its next watering day.<br><button class="btn btn-primary" data-act="add">Add plant</button></div>`);
    } else if (all.length && emptyEl) emptyEl.remove();

    $('#rooms').innerHTML = [...new Set(plants.map(p=>p.place).filter(Boolean))].map(r=>`<option value="${esc(r)}">`).join('');
  }

  // ---- actions ----
  let undoState = null, toastTimer;
  function toast(msg, undo){
    $('#toastMsg').textContent = msg;
    undoState = undo || null;
    $('#toastUndo').hidden = !undo;
    $('#toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $('#toast').classList.remove('show'); undoState = null; }, 5000);
  }
  $('#toastUndo').addEventListener('click', () => {
    if (!undoState) return;
    plants = undoState; save(); render();
    $('#toast').classList.remove('show'); undoState = null;
  });

  const snapshot = () => JSON.parse(JSON.stringify(plants));

  function water(id){
    const p = plants.find(x => x.id === id); if (!p) return;
    const before = snapshot();
    const t = iso(todayD());
    // animate the pot(s) filling before re-render
    document.querySelectorAll(`.plant[data-id="${id}"] .water`).forEach(r => { r.setAttribute('y', 14); r.setAttribute('height', 40); r.style.y = '14px'; r.style.height = '40px'; });
    p.last = t;
    p.history = [t, ...(p.history||[]).filter(d => d !== t)].slice(0, 12);
    save();
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(render, reduce ? 0 : 700);
    toast(`Watered ${p.name}. Next on ${fmtShort(addDays(todayD(), p.every))}.`, before);
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const li = b.closest('.plant');
    const act = b.dataset.act;
    if (act === 'water') water(li.dataset.id);
    else if (act === 'edit') openDlg(li.dataset.id);
    else if (act === 'add') openDlg();
  });
  $('#addBtn').addEventListener('click', () => openDlg());
  $('#sortSel').addEventListener('change', () => { try{localStorage.setItem(KEY+'.sort', $('#sortSel').value);}catch(e){} render(); });
  try { const s = localStorage.getItem(KEY+'.sort'); if (s) $('#sortSel').value = s; } catch(e){}

  // ---- dialog ----
  const dlg = $('#dlg');
  let editing = null;
  function syncPresets(){
    const v = $('#fEvery').value;
    document.querySelectorAll('#presets button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.d === v)));
  }
  $('#presets').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $('#fEvery').value = b.dataset.d; syncPresets(); });
  $('#fEvery').addEventListener('input', syncPresets);

  function openDlg(id){
    editing = id ? plants.find(p => p.id === id) : null;
    $('#dlgTitle').textContent = editing ? `Edit ${editing.name}` : 'Add a plant';
    $('#saveBtn').textContent = editing ? 'Save changes' : 'Add plant';
    $('#delBtn').hidden = !editing;
    $('#fName').value = editing?.name ?? '';
    $('#fPlace').value = editing?.place ?? '';
    $('#fEvery').value = editing?.every ?? 7;
    $('#fLast').value = editing?.last ?? iso(todayD());
    $('#fLast').max = iso(todayD());
    $('#fNote').value = editing?.note ?? '';
    $('#nameErr').textContent = '';
    const h = editing?.history ?? [];
    $('#histWrap').hidden = !h.length;
    $('#hist').innerHTML = h.slice(0,8).map(d => `<li>${fmtShort(parse(d))}</li>`).join('');
    syncPresets();
    dlg.showModal();
    setTimeout(() => $('#fName').focus(), 30);
  }
  $('#cancelBtn').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

  $('#form').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#fName').value.trim();
    if (!name){ $('#nameErr').textContent = 'Give the plant a name so you can tell it apart.'; $('#fName').focus(); return; }
    let every = parseInt($('#fEvery').value, 10);
    if (!(every >= 1)) every = 7; every = Math.min(every, 120);
    let last = $('#fLast').value || iso(todayD());
    if (last > iso(todayD())) last = iso(todayD());
    const data = { name, place: $('#fPlace').value.trim(), every, last, note: $('#fNote').value.trim() };
    const before = snapshot();
    if (editing){
      Object.assign(editing, data);
      if (!editing.history.includes(last)) editing.history = [last, ...editing.history].sort().reverse().slice(0,12);
      toast(`Saved changes to ${name}.`, before);
    } else {
      plants.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), ...data, history: [last] });
      toast(`Added ${name}.`, before);
    }
    save(); dlg.close(); render();
  });
  $('#delBtn').addEventListener('click', () => {
    if (!editing) return;
    const before = snapshot();
    plants = plants.filter(p => p.id !== editing.id);
    save(); dlg.close(); render();
    toast(`Removed ${editing.name}.`, before);
  });

  // ---- export / import ----
  $('#exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(plants, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `plants-${iso(todayD())}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Exported your plants as a JSON file.');
  });
  $('#importBtn').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!Array.isArray(data) || !data.every(p => p && p.name && p.every && p.last)) throw 0;
      const before = snapshot();
      plants = data.map(p => ({ history: [], place:'', note:'', ...p, id: p.id || String(Math.random()).slice(2) }));
      save(); render(); toast(`Imported ${plants.length} plants.`, before);
    } catch(err){ toast('That file isn’t a plant export. Choose a .json file saved with Export plants.'); }
    e.target.value = '';
  });

  render();
  // Refresh at midnight so "today" stays true if the tab stays open.
  setInterval(() => { const d = iso(todayD()); if (d !== render._d){ render._d = d; render(); } }, 60000);
  render._d = iso(todayD());
})();
</script>
</body>
</html>
