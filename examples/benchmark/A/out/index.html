<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soak · Houseplant watering</title>
<meta name="description" content="See which houseplants need water today and log a watering in one tap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wdth,wght,ROND@6..144,25..151,100..1000,0..100&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3c5 7 9 11.5 9 16.5A9 9 0 0 1 7 19.5C7 14.5 11 10 16 3z' fill='%232B6CB0'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#F6F7F4; --tag:#FFFFFF; --ink:#1B1F1D; --ink-2:#58605C; --rule:#DCDFDA; --rule-2:#C7CBC5;
  --water:#2B6CB0; --water-ink:#FFFFFF; --water-tint:#E4EEF7; --water-deep:#1F5690;
  --late:#7A2314; --late-tint:#F6E8E4; --fine:#2F6B3A;
  --focus:#2B6CB0;
  --r-1:4px; --r-2:8px; --r-3:14px;
  --dur-1:100ms; --dur-2:160ms; --dur-3:240ms; --dur-4:400ms;
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-move:cubic-bezier(.3,.7,.1,1);
  --shadow-float:0 18px 48px -12px rgba(20,28,24,.28), 0 2px 6px rgba(20,28,24,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121614; --tag:#1A1F1C; --ink:#E8ECE9; --ink-2:#A3ADA8; --rule:#2C3430; --rule-2:#3A443F;
    --water:#6FA8DE; --water-ink:#0E1A26; --water-tint:#1B2A38; --water-deep:#9CC4EA;
    --late:#F0A08E; --late-tint:#2E1D19; --fine:#8FC79A; --focus:#6FA8DE;
    --shadow-float:0 18px 48px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121614; --tag:#1A1F1C; --ink:#E8ECE9; --ink-2:#A3ADA8; --rule:#2C3430; --rule-2:#3A443F;
  --water:#6FA8DE; --water-ink:#0E1A26; --water-tint:#1B2A38; --water-deep:#9CC4EA;
  --late:#F0A08E; --late-tint:#2E1D19; --fine:#8FC79A; --focus:#6FA8DE;
  --shadow-float:0 18px 48px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Google Sans Flex","Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.45; font-variation-settings:"ROND" 40;
}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.wrap{max-width:1180px; margin:0 auto; padding:0 16px}
header.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 0 8px}
.mark{display:flex; align-items:center; gap:8px; font-size:23px; font-weight:650; letter-spacing:-.01em; font-variation-settings:"ROND" 100, "opsz" 40}
.mark svg{width:22px;height:22px;color:var(--water)}
.mark small{font-size:14px; font-weight:400; color:var(--ink-2); letter-spacing:0; margin-left:4px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:40px; padding:0 14px;
  border-radius:var(--r-1); border:1px solid var(--rule-2); background:var(--tag); color:var(--ink);
  font-size:14px; font-weight:550; cursor:pointer; white-space:nowrap;
  transition:background var(--dur-1) var(--ease-out), border-color var(--dur-1) var(--ease-out), color var(--dur-1);
}
.btn:hover{border-color:var(--ink-2)}
.btn svg{width:1.1em;height:1.1em;flex:none}
.btn.primary{background:var(--water); border-color:var(--water); color:var(--water-ink)}
.btn.primary:hover{background:var(--water-deep); border-color:var(--water-deep)}
.btn.quiet{background:transparent; border-color:transparent; color:var(--ink-2)}
.btn.quiet:hover{color:var(--ink); background:color-mix(in srgb,var(--ink) 6%,transparent)}
.btn.danger{color:var(--late)}
.btn.danger:hover{border-color:var(--late)}

.layout{display:grid; grid-template-columns:minmax(0,1fr); gap:32px; padding-bottom:64px}
@media (min-width:960px){ .layout{grid-template-columns:minmax(0,1fr) 360px} }

/* ---------- summary + strip ---------- */
.summary{font-size:28px; line-height:1.18; font-weight:500; letter-spacing:-.015em; margin:20px 0 20px; max-width:26ch; font-variation-settings:"ROND" 70, "opsz" 36; text-wrap:balance}
.summary em{font-style:normal; color:var(--late)}
.summary .ok{color:var(--fine)}
@media (min-width:720px){ .summary{font-size:40px; max-width:22ch} }

.strip{display:grid; grid-template-columns:repeat(14,minmax(0,1fr)); border:1px solid var(--rule); border-radius:var(--r-2); background:var(--tag); overflow:hidden}
.day{position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 0 10px; border:0; border-left:1px solid var(--rule); background:none; cursor:pointer; min-width:0}
.day:first-child{border-left:0}
.day .dow{font-size:12px; color:var(--ink-2)}
.day .dn{font-size:14px; font-weight:550}
.day .drops{display:flex; flex-direction:column-reverse; gap:2px; height:34px; justify-content:flex-start; align-items:center}
.day .drops i{display:block; width:8px; height:8px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); background:var(--water)}
.day .drops i.late{background:var(--late)}
.day .more{font-size:12px; color:var(--ink-2); line-height:1}
.day.today{background:var(--water-tint)}
.day.today .dn{color:var(--water-deep)}
.day[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--ink)}
.day:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.day.today:hover{background:var(--water-tint)}
@media (max-width:560px){
  .strip{grid-template-columns:repeat(7,minmax(0,1fr))}
  .day:nth-child(n+8){display:none}
}

.filters{display:flex; flex-wrap:wrap; gap:6px; margin:20px 0 4px; align-items:center}
.chip{min-height:32px; padding:0 12px; border-radius:var(--r-1); border:1px solid var(--rule); background:transparent; font-size:14px; cursor:pointer; color:var(--ink-2)}
.chip:hover{color:var(--ink); border-color:var(--rule-2)}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.chip .c{margin-left:6px; opacity:.7}
@media (max-width:560px){
  .filters{flex-wrap:nowrap; overflow-x:auto; margin-left:-16px; margin-right:-16px; padding:0 16px 4px; scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .filter-note{flex:none}
  footer.foot .btn.quiet{padding:0 8px}
}
.filter-note{font-size:14px; color:var(--ink-2); margin-left:4px}
.filter-note button{border:0;background:none;color:var(--water-deep);text-decoration:underline;cursor:pointer;padding:0 2px;font-size:14px}

/* ---------- groups + rows ---------- */
.group{margin-top:24px}
.group h2{display:flex; align-items:baseline; gap:8px; margin:0 0 8px; font-size:14px; font-weight:600; color:var(--ink-2)}
.group h2 .n{font-weight:400}
.group.late h2{color:var(--late)}
.rows{list-style:none; margin:0; padding:0; background:var(--tag); border:1px solid var(--rule); border-radius:var(--r-2)}
.row{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:14px; padding:12px 12px 12px 14px; border-top:1px solid var(--rule); transition:background var(--dur-3) var(--ease-out)}
.row:first-child{border-top:0}
.row.sel{background:color-mix(in srgb,var(--water) 7%,var(--tag))}
.row.fresh{background:var(--water-tint)}
.row .open{all:unset; cursor:pointer; min-width:0; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 16px; align-items:baseline; border-radius:var(--r-1)}
.row .open:focus-visible{outline:2px solid var(--focus); outline-offset:4px}
.pname{font-size:16px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pmeta{grid-column:1; font-size:14px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pdue{grid-column:2; grid-row:1 / span 2; align-self:center; text-align:right; font-size:14px; font-weight:550; white-space:nowrap}
.pdue small{display:block; font-weight:400; color:var(--ink-2); font-size:12px}
.pdue.late{color:var(--late)}
.pdue.today{color:var(--water-deep)}
.pdue.later{color:var(--ink-2); font-weight:400}
.act{display:flex; gap:4px; align-items:center}
.act .btn{min-width:84px}
.undo-note{font-size:14px; color:var(--ink-2)}
@media (max-width:560px){
  .row{gap:10px; padding:10px}
  .row .open{grid-template-columns:minmax(0,1fr)}
  .pdue{grid-column:1; grid-row:auto; text-align:left}
  .pdue small{display:inline; margin-left:6px}
  .act .btn{min-width:72px; min-height:44px}
}

/* the plant-tag gauge */
.gauge{--lvl:0; position:relative; width:16px; height:46px; flex:none; background:var(--rule-2);
  clip-path:polygon(0 0,100% 0,100% 80%,50% 100%,0 80%)}
.gauge::before{content:""; position:absolute; inset:1.5px 1.5px 2.5px; background:var(--tag); clip-path:polygon(0 0,100% 0,100% 80%,50% 100%,0 80%)}
.gauge .mask{position:absolute; inset:1.5px 1.5px 2.5px; clip-path:polygon(0 0,100% 0,100% 80%,50% 100%,0 80%); overflow:hidden}
.gauge .mask .fill{position:absolute; left:0; right:0; bottom:0; height:calc(100% * var(--lvl)); background:var(--water); transition:height var(--dur-4) var(--ease-move)}
.gauge .hole{position:absolute; top:5px; left:50%; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:var(--rule-2); z-index:1}
.gauge.rise .mask .fill{animation:rise var(--dur-4) var(--ease-move)}
@keyframes rise{from{height:0}}
.gauge.dry{background:var(--late)}
.gauge.big{width:26px; height:74px}
.gauge.big .hole{top:8px; width:6px;height:6px;margin-left:-3px}

/* ---------- empty ---------- */
.empty{border:1px dashed var(--rule-2); border-radius:var(--r-2); padding:32px 24px; background:var(--tag); margin-top:24px; max-width:640px}
.empty h2{margin:0 0 8px; font-size:23px; font-weight:600; letter-spacing:-.01em}
.empty p{margin:0 0 16px; color:var(--ink-2); max-width:52ch}
.empty .btns{display:flex; flex-wrap:wrap; gap:8px}
.nomatch{padding:20px; color:var(--ink-2); font-size:14px}

/* ---------- detail panel ---------- */
.detail{align-self:start}
@media (min-width:960px){ .detail{position:sticky; top:16px; margin-top:20px} }
.card{background:var(--tag); border:1px solid var(--rule); border-radius:var(--r-2); padding:20px}
.dhead{display:grid; grid-template-columns:auto minmax(0,1fr); gap:16px; align-items:start}
.dhead h2{margin:0; font-size:23px; line-height:1.15; font-weight:600; letter-spacing:-.01em; overflow-wrap:anywhere; font-variation-settings:"ROND" 80}
.dhead .sp{margin:4px 0 0; color:var(--ink-2); font-size:14px}
.dstat{margin:12px 0 0; font-size:16px; font-weight:550}
.dstat.late{color:var(--late)} .dstat.today{color:var(--water-deep)}
.facts{display:grid; grid-template-columns:auto 1fr; gap:6px 16px; margin:20px 0 0; font-size:14px}
.facts dt{color:var(--ink-2)} .facts dd{margin:0}
.stepper{display:inline-flex; align-items:center; border:1px solid var(--rule-2); border-radius:var(--r-1)}
.stepper button{width:32px; height:30px; border:0; background:none; cursor:pointer; font-size:16px; color:var(--ink-2)}
.stepper button:hover{color:var(--ink)}
.stepper span{min-width:84px; text-align:center; font-size:14px}
.dact{display:flex; flex-wrap:wrap; gap:8px; margin-top:20px}
.dact .primary{flex:1 1 140px}
.otherday{display:flex; gap:8px; align-items:center; margin-top:10px; font-size:14px; color:var(--ink-2); flex-wrap:wrap}
.otherday input{min-height:36px; padding:0 8px; border:1px solid var(--rule-2); border-radius:var(--r-1); background:var(--tag)}
.sec{margin-top:24px; padding-top:16px; border-top:1px solid var(--rule)}
.sec h3{margin:0 0 8px; font-size:14px; font-weight:600; color:var(--ink-2)}
.notes{margin:0; white-space:pre-wrap; font-size:14px; overflow-wrap:anywhere}
.hist{list-style:none; margin:0; padding:0; font-size:14px}
.hist li{display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-top:1px solid var(--rule)}
.hist li:first-child{border-top:0}
.hist .gap{color:var(--ink-2)}
.hist .gap.long{color:var(--late)}
.hist-rm{border:0;background:none;color:var(--ink-2);cursor:pointer;padding:0 4px;font-size:14px}
.hist-rm:hover{color:var(--late)}
.rhythm{font-size:14px; color:var(--ink-2); margin:8px 0 0}
.dfoot{display:flex; justify-content:space-between; gap:8px; margin-top:20px}
.detail-empty{color:var(--ink-2); font-size:14px; padding:20px; border:1px dashed var(--rule-2); border-radius:var(--r-2)}
.sheet-close{display:none}

/* mobile: detail becomes a bottom sheet */
@media (max-width:959px){
  .detail{position:fixed; inset:auto 0 0 0; z-index:20; max-height:88vh; overflow:auto; transform:translateY(100%); visibility:hidden;
    transition:transform var(--dur-3) var(--ease-out), visibility 0s linear var(--dur-3)}
  .detail .card{border-radius:var(--r-3) var(--r-3) 0 0; border-bottom:0; box-shadow:var(--shadow-float); padding:12px 16px 24px}
  .detail.open{transform:none; visibility:visible; transition:transform var(--dur-3) var(--ease-out)}
  .detail-empty{display:none}
  .sheet-close{display:flex; justify-content:center; margin-bottom:8px}
  .sheet-close button{border:0; background:none; padding:8px 24px; cursor:pointer}
  .sheet-close button span{display:block; width:40px; height:4px; border-radius:2px; background:var(--rule-2)}
  .scrim{position:fixed; inset:0; background:rgba(10,14,12,.4); z-index:19; opacity:0; pointer-events:none; transition:opacity var(--dur-3)}
  .scrim.on{opacity:1; pointer-events:auto}
}
@media (min-width:960px){ .scrim{display:none} }

/* ---------- dialog form ---------- */
dialog{border:0; padding:0; border-radius:var(--r-3); background:var(--tag); color:var(--ink); box-shadow:var(--shadow-float); width:min(520px, calc(100vw - 32px)); max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(10,14,12,.45)}
dialog[open]{animation:pop var(--dur-3) var(--ease-out)}
@keyframes pop{from{opacity:0; transform:translateY(8px)}}
form.pf{padding:24px}
form.pf h2{margin:0 0 16px; font-size:23px; font-weight:600; letter-spacing:-.01em}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
.field label{font-size:14px; font-weight:550}
.field .hint{font-size:12px; color:var(--ink-2)}
.field input,.field textarea,.field select{min-height:40px; padding:8px 10px; border:1px solid var(--rule-2); border-radius:var(--r-1); background:var(--paper); width:100%}
.field textarea{min-height:72px; resize:vertical}
.field input:focus,.field textarea:focus{outline:2px solid var(--focus); outline-offset:0; border-color:transparent}
.field.err input{border-color:var(--late)}
.field .msg{font-size:12px; color:var(--late); display:none}
.field.err .msg{display:block}
.two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:480px){ .two{grid-template-columns:1fr} }
.quick{display:flex; flex-wrap:wrap; gap:4px}
.quick button{min-height:30px; padding:0 10px; border:1px solid var(--rule); border-radius:var(--r-1); background:none; cursor:pointer; font-size:14px; color:var(--ink-2)}
.quick button[aria-pressed="true"]{border-color:var(--water); color:var(--water-deep); background:var(--water-tint)}
.every{display:flex; align-items:center; gap:8px}
.every input{width:88px}
.formbtns{display:flex; justify-content:flex-end; gap:8px; margin-top:8px}

footer.foot{border-top:1px solid var(--rule); padding:16px 0 32px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; font-size:14px; color:var(--ink-2)}
footer.foot .btn{min-height:32px; font-size:14px}
.status-line{margin-left:auto}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3.2c3.6 4.8 6.3 8.2 6.3 11.7a6.3 6.3 0 0 1-12.6 0c0-3.5 2.7-6.9 6.3-11.7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-drop-f" viewBox="0 0 24 24"><path d="M12 3.2c3.6 4.8 6.3 8.2 6.3 11.7a6.3 6.3 0 0 1-12.6 0c0-3.5 2.7-6.9 6.3-11.7z" fill="currentColor"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
</svg>

<div class="wrap">
  <header class="top">
    <div class="mark"><svg aria-hidden="true"><use href="#i-drop-f"/></svg>Soak<small>watering log</small></div>
    <button class="btn primary" id="addBtn" type="button"><svg aria-hidden="true"><use href="#i-plus"/></svg>Add plant</button>
  </header>

  <div class="layout">
    <main id="main">
      <p class="summary" id="summary" aria-live="polite"></p>
      <div id="stripWrap"></div>
      <div class="filters" id="filters" role="group" aria-label="Filter by room"></div>
      <div id="list"></div>
    </main>
    <aside class="detail" id="detail" aria-label="Plant details"></aside>
  </div>

  <footer class="foot">
    <span>Saved on this device only.</span>
    <button class="btn quiet" id="exportBtn" type="button">Export backup</button>
    <button class="btn quiet" id="importBtn" type="button">Import backup</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <span class="status-line" id="statusLine" role="status"></span>
  </footer>
</div>
<div class="scrim" id="scrim"></div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form class="pf" id="pf" method="dialog" novalidate>
    <h2 id="dlgTitle">Add a plant</h2>
    <div class="field" id="f-name">
      <label for="in-name">Name</label>
      <input id="in-name" name="name" autocomplete="off" maxlength="60" placeholder="e.g. Big Monty">
      <span class="msg">Give it a name so you can tell it apart.</span>
    </div>
    <div class="two">
      <div class="field">
        <label for="in-species">Kind of plant</label>
        <input id="in-species" name="species" list="dl-species" autocomplete="off" maxlength="60" placeholder="Monstera deliciosa">
        <span class="hint" id="speciesHint">Pick one to get a starting schedule.</span>
      </div>
      <div class="field">
        <label for="in-room">Where it lives</label>
        <input id="in-room" name="room" list="dl-rooms" autocomplete="off" maxlength="40" placeholder="Living room">
      </div>
    </div>
    <div class="field" id="f-every">
      <label for="in-every">Water every</label>
      <div class="every"><input id="in-every" name="every" type="number" min="1" max="120" inputmode="numeric" class="num"><span>days</span></div>
      <div class="quick" id="quickEvery"></div>
      <span class="msg">Use a number of days from 1 to 120.</span>
    </div>
    <div class="field" id="f-last">
      <label for="in-last">Last watered</label>
      <input id="in-last" name="last" type="date">
      <span class="hint">Leave empty if you don't remember. It will show as due today.</span>
      <span class="msg">That date is in the future.</span>
    </div>
    <div class="field">
      <label for="in-notes">Notes</label>
      <textarea id="in-notes" name="notes" maxlength="400" placeholder="Let the top 2 cm dry out. Bottom-water."></textarea>
    </div>
    <div class="formbtns">
      <button class="btn quiet" type="button" id="cancelBtn">Cancel</button>
      <button class="btn primary" type="submit" id="saveBtn">Add plant</button>
    </div>
  </form>
</dialog>
<datalist id="dl-species"></datalist>
<datalist id="dl-rooms"></datalist>

<script>
(() => {
'use strict';
const KEY = 'soak.v1';
const DAY = 86400000;

/* typical indoor intervals, in days, for a starting point */
const PRESETS = [
  ['Monstera deliciosa',7],['Golden pothos',7],['Heartleaf philodendron',7],['Snake plant',14],['ZZ plant',18],
  ['Peace lily',5],['Fiddle-leaf fig',7],['Boston fern',3],['Calathea',5],['Spider plant',6],['Rubber plant',9],
  ['Aloe vera',18],['Jade plant',16],['Chinese money plant',7],['String of pearls',12],['Phalaenopsis orchid',8],
  ['Bird of paradise',7],['Cactus',24],['Maidenhair fern',3],['Dracaena',10],['Hoya',10],['Parlor palm',7]
];
const QUICK = [3,5,7,10,14,21];

/* ---------- dates (local calendar days) ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayISO = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diff = (a, b) => Math.round((parse(b) - parse(a)) / DAY); // b - a in days
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nice = s => { const d = parse(s); const t = todayISO(); const k = diff(t, s);
  if (k === 0) return 'Today'; if (k === -1) return 'Yesterday'; if (k === 1) return 'Tomorrow';
  const base = `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
  return d.getFullYear() === new Date().getFullYear() ? base : `${base} ${d.getFullYear()}`; };
const lc = s => /^(Today|Tomorrow|Yesterday)$/.test(s) ? s.toLowerCase() : s;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

/* ---------- storage ---------- */
let state = { plants: [] };
let storageOK = true;
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.plants)) state = s; } }
  catch(e){ storageOK = false; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ storageOK = false; status("Couldn't save to this browser. Your changes last until you close the tab. Use Export backup to keep them."); }
}
const uid = () => Math.random().toString(36).slice(2,10);

/* ---------- plant logic ---------- */
function dueDate(p){
  if (!p.last) return todayISO();
  const due = addDays(p.last, p.every);
  return (p.snooze && p.snooze > due) ? p.snooze : due;
}
function delta(p){ return diff(todayISO(), dueDate(p)); } // days until due, negative = late
function level(p){
  if (!p.last) return 0;
  const since = diff(p.last, todayISO());
  return Math.max(0, Math.min(1, 1 - since / p.every));
}
function dueText(p){
  const k = delta(p);
  if (!p.last) return ['Not logged yet', 'today'];
  if (k < 0) return [`${plural(-k,'day')} late`, 'late'];
  if (k === 0) return [p.snooze === todayISO() && diff(p.last, todayISO()) < p.every ? 'Today (moved)' : 'Today', 'today'];
  if (k === 1) return ['Tomorrow', 'soon'];
  if (k < 7) return [`In ${k} days`, k <= 3 ? 'soon' : 'later'];
  return [nice(dueDate(p)), 'later'];
}
function lastText(p){
  if (!p.last) return 'never logged';
  const s = diff(p.last, todayISO());
  return s === 0 ? 'watered today' : s === 1 ? 'watered yesterday' : `watered ${s} days ago`;
}
function groupOf(p){
  const k = delta(p);
  if (k < 0) return 'late';
  if (k === 0) return 'today';
  if (k <= 3) return 'soon';
  return 'later';
}
const GROUPS = [['late','Late'],['today','Today'],['soon','Next 3 days'],['later','Later']];

/* ---------- ui state ---------- */
let selected = null, room = 'all', dayFilter = null, sheetOpen = false;
const fresh = new Map(); // id -> {group, undo, timer}
let riseId = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function status(msg){ const el = $('#statusLine'); el.textContent = msg; clearTimeout(status.t); status.t = setTimeout(() => el.textContent = '', 6000); }

/* ---------- actions ---------- */
function water(id, date = todayISO()){
  const p = state.plants.find(x => x.id === id); if (!p) return;
  const before = { last: p.last, snooze: p.snooze, history: [...p.history] };
  const g = groupOf(p);
  if (!p.history.includes(date)) p.history.push(date);
  p.history.sort();
  p.last = p.history[p.history.length-1];
  p.snooze = null;
  save();
  if (date === todayISO()){
    const prev = fresh.get(id); if (prev) clearTimeout(prev.timer);
    riseId = id;
    fresh.set(id, { group: g, undo: before, timer: setTimeout(() => { fresh.delete(id); render(); }, 7000) });
  }
  render();
}
function undo(id){
  const f = fresh.get(id); const p = state.plants.find(x => x.id === id);
  if (!f || !p) return;
  clearTimeout(f.timer); fresh.delete(id);
  Object.assign(p, { last: f.undo.last, snooze: f.undo.snooze, history: f.undo.history });
  save(); render();
  const btn = document.querySelector(`[data-water="${id}"]`); if (btn) btn.focus();
}
function snooze(id){
  const p = state.plants.find(x => x.id === id); if (!p) return;
  const base = delta(p) < 0 ? todayISO() : dueDate(p);
  p.snooze = addDays(base, 1); save(); render();
  status(`${p.name} moved to ${lc(nice(p.snooze))}.`);
}
function setEvery(id, n){
  const p = state.plants.find(x => x.id === id); if (!p) return;
  p.every = Math.max(1, Math.min(120, n)); save(); render();
}
function removeHistory(id, date){
  const p = state.plants.find(x => x.id === id); if (!p) return;
  p.history = p.history.filter(d => d !== date);
  p.last = p.history.length ? p.history[p.history.length-1] : null;
  save(); render();
}
function del(id){
  const p = state.plants.find(x => x.id === id); if (!p) return;
  if (!confirm(`Delete ${p.name} and its watering history? This can't be undone.`)) return;
  state.plants = state.plants.filter(x => x.id !== id);
  if (selected === id) { selected = null; closeSheet(); }
  save(); render(); status(`${p.name} deleted.`);
}

/* ---------- render ---------- */
function render(){
  renderSummary(); renderStrip(); renderFilters(); renderList(); renderDetail(); renderDatalists();
  riseId = null;
}

function renderSummary(){
  const ps = state.plants, el = $('#summary');
  if (!ps.length){ el.textContent = 'Nothing to water yet. Add the plants you have and Soak will tell you when each one is thirsty.'; return; }
  const late = ps.filter(p => groupOf(p) === 'late' && !fresh.has(p.id)).sort((a,b) => delta(a) - delta(b));
  const today = ps.filter(p => groupOf(p) === 'today' && !fresh.has(p.id));
  const need = late.length + today.length;
  if (!need){
    const next = [...ps].sort((a,b) => delta(a) - delta(b))[0];
    const [t] = dueText(next);
    el.innerHTML = `<span class="ok">Everything's watered.</span> Next up: ${esc(next.name)}, ${esc(/^In /.test(t) ? t.toLowerCase() : lc(t))}.`;
    return;
  }
  let s = `${plural(need,'plant')} ${need === 1 ? 'needs' : 'need'} water today.`;
  if (late.length){
    const w = late[0], k = -delta(w);
    s += late.length === 1 ? ` <em>${esc(w.name)} is ${plural(k,'day')} late.</em>` : ` <em>${late.length} are late, ${esc(w.name)} by ${plural(k,'day')}.</em>`;
  }
  el.innerHTML = s;
}

function renderStrip(){
  const wrap = $('#stripWrap');
  if (!state.plants.length){ wrap.innerHTML = ''; return; }
  const t = todayISO(); let h = '<div class="strip" role="group" aria-label="Next 14 days">';
  for (let i = 0; i < 14; i++){
    const d = addDays(t, i), dd = parse(d);
    const due = state.plants.filter(p => { const k = delta(p); return i === 0 ? k <= 0 : k === i; });
    const lateN = i === 0 ? due.filter(p => delta(p) < 0).length : 0;
    const shown = Math.min(due.length, 4);
    let drops = ''; for (let j = 0; j < shown; j++) drops += `<i class="${j < lateN ? 'late' : ''}"></i>`;
    const names = due.map(p => p.name).join(', ');
    const label = `${i === 0 ? 'Today' : nice(d)}: ${due.length ? plural(due.length,'plant') + ' — ' + names : 'nothing due'}`;
    h += `<button type="button" class="day${i === 0 ? ' today' : ''}" data-day="${d}" aria-pressed="${dayFilter === d}" title="${esc(label)}" aria-label="${esc(label)}">
      <span class="dow">${i === 0 ? 'Today' : DOW[dd.getDay()]}</span><span class="dn num">${dd.getDate()}</span>
      <span class="drops">${drops}</span>${due.length > 4 ? `<span class="more num">+${due.length - 4}</span>` : ''}</button>`;
  }
  wrap.innerHTML = h + '</div>';
}

function rooms(){
  const m = new Map();
  state.plants.forEach(p => { const r = p.room || 'No room'; m.set(r, (m.get(r) || 0) + 1); });
  return [...m.entries()].sort((a,b) => a[0].localeCompare(b[0]));
}
function renderFilters(){
  const el = $('#filters'); const rs = rooms();
  if (room !== 'all' && !rs.find(r => r[0] === room)) room = 'all';
  if (state.plants.length < 2 || (rs.length < 2 && !dayFilter)){ el.innerHTML = ''; return; }
  let h = '';
  if (rs.length > 1){
    h += `<button type="button" class="chip" data-room="all" aria-pressed="${room === 'all'}">All<span class="c num">${state.plants.length}</span></button>`;
    h += rs.map(([r,n]) => `<button type="button" class="chip" data-room="${esc(r)}" aria-pressed="${room === r}">${esc(r)}<span class="c num">${n}</span></button>`).join('');
  }
  if (dayFilter) h += `<span class="filter-note">Showing plants due ${esc(lc(nice(dayFilter)))}. <button type="button" data-clearday>Show all days</button></span>`;
  el.innerHTML = h;
}

function gauge(p, big){
  const lvl = fresh.has(p.id) ? 1 : level(p);
  const dry = p.last && delta(p) < 0 && !fresh.has(p.id);
  return `<span class="gauge${big ? ' big' : ''}${riseId === p.id ? ' rise' : ''}${dry ? ' dry' : ''}" style="--lvl:${lvl.toFixed(3)}" role="img" aria-label="Soil moisture estimate ${Math.round(lvl*100)} percent"><span class="mask"><span class="fill"></span></span><span class="hole"></span></span>`;
}

function renderList(){
  const el = $('#list');
  if (!state.plants.length){
    el.innerHTML = `<div class="empty">
      <h2>Start with the plant you forget most</h2>
      <p>Add a plant, say how often it wants water, and tap <strong>Water</strong> when you've done it. Soak counts the days and lines up what's due.</p>
      <div class="btns"><button class="btn primary" type="button" data-add><svg aria-hidden="true"><use href="#i-plus"/></svg>Add your first plant</button>
      <button class="btn" type="button" data-examples>Try it with 7 example plants</button></div></div>`;
    return;
  }
  let ps = state.plants.filter(p => room === 'all' || (p.room || 'No room') === room);
  if (dayFilter){ const i = diff(todayISO(), dayFilter); ps = ps.filter(p => { const k = delta(p); return i === 0 ? k <= 0 : k === i; }); }
  if (!ps.length){ el.innerHTML = `<div class="group"><div class="rows"><p class="nomatch">No plants due ${dayFilter ? esc(lc(nice(dayFilter))) : ''}${room !== 'all' ? ' in ' + esc(room) : ''}.</p></div></div>`; return; }
  const by = { late:[], today:[], soon:[], later:[] };
  ps.forEach(p => by[fresh.has(p.id) ? fresh.get(p.id).group : groupOf(p)].push(p));
  let h = '';
  for (const [g, label] of GROUPS){
    const list = by[g]; if (!list.length) continue;
    list.sort((a,b) => (fresh.has(a.id) - fresh.has(b.id)) || delta(a) - delta(b) || a.name.localeCompare(b.name));
    h += `<section class="group ${g}" aria-labelledby="g-${g}"><h2 id="g-${g}">${label}<span class="n num">${list.length}</span></h2><ul class="rows">`;
    h += list.map(p => row(p, g)).join('');
    h += '</ul></section>';
  }
  el.innerHTML = h;
}
function row(p, g){
  const f = fresh.has(p.id);
  const [t, cls] = f ? ['Watered today', 'later'] : dueText(p);
  const meta = [p.species, p.room].filter(Boolean).join(', ') || 'No details yet';
  const sub = f ? `next ${lc(nice(dueDate(p)))}` : `every ${plural(p.every,'day')}`;
  const act = f
    ? `<button class="btn" type="button" data-undo="${p.id}">Undo</button>`
    : `<button class="btn ${g === 'late' || g === 'today' ? 'primary' : ''}" type="button" data-water="${p.id}" aria-label="Log watering for ${esc(p.name)}"><svg aria-hidden="true"><use href="#i-drop"/></svg>Water</button>`;
  return `<li class="row${selected === p.id ? ' sel' : ''}${f ? ' fresh' : ''}" data-id="${p.id}">
    ${gauge(p)}
    <button type="button" class="open" data-open="${p.id}" aria-label="${esc(p.name)}: ${esc(t)}. Show details">
      <span class="pname">${esc(p.name)}</span>
      <span class="pdue ${cls} num">${esc(t)}<small>${esc(sub)}</small></span>
      <span class="pmeta">${esc(meta)}</span>
    </button>
    <div class="act">${act}</div></li>`;
}

function renderDetail(){
  const el = $('#detail');
  if (!selected && !mq.matches && state.plants.length){
    selected = [...state.plants].sort((a,b) => delta(a) - delta(b))[0].id;
    document.querySelector(`[data-id="${selected}"]`)?.classList.add('sel');
  }
  const p = state.plants.find(x => x.id === selected);
  if (!p){
    el.innerHTML = state.plants.length ? `<div class="detail-empty">Pick a plant to see its watering history, notes and schedule.</div>` : '';
    el.classList.remove('open'); $('#scrim').classList.remove('on'); return;
  }
  const [t, cls] = fresh.has(p.id) ? ['Watered today', ''] : dueText(p);
  const hist = [...p.history].sort().reverse();
  const gaps = hist.map((d,i) => i < hist.length-1 ? diff(hist[i+1], d) : null);
  const real = gaps.filter(x => x != null).slice(0, 6);
  const avg = real.length ? Math.round(real.reduce((a,b)=>a+b,0) / real.length) : null;
  let rhythm = '';
  if (avg != null && real.length >= 2){
    rhythm = avg > p.every + 1 ? `Lately you've watered about every ${plural(avg,'day')}, later than the ${p.every}-day schedule. If it looks happy, stretch the schedule.`
      : avg < p.every - 1 ? `Lately you've watered about every ${plural(avg,'day')}, sooner than the schedule. If the soil is dry by then, shorten it.`
      : `You've kept to the schedule: about every ${plural(avg,'day')}.`;
  }
  el.innerHTML = `<div class="card">
    <div class="sheet-close"><button type="button" data-close aria-label="Close details"><span></span></button></div>
    <div class="dhead">${gauge(p, true)}<div>
      <h2 id="dName">${esc(p.name)}</h2>
      <p class="sp">${esc([p.species, p.room].filter(Boolean).join(' · ') || 'No kind or room set')}</p>
      <p class="dstat ${cls}">${esc(t)}${p.last ? `<span style="font-weight:400;color:var(--ink-2)">, ${esc(lastText(p))}</span>` : ''}</p>
    </div></div>
    <dl class="facts">
      <dt>Schedule</dt><dd><span class="stepper"><button type="button" data-every="-1" aria-label="Water more often (shorter gap)">−</button><span class="num" aria-live="polite">every ${plural(p.every,'day')}</span><button type="button" data-every="1" aria-label="Water less often (longer gap)">+</button></span></dd>
      <dt>${delta(p) < 0 && !fresh.has(p.id) ? 'Was due' : 'Next'}</dt><dd class="num">${esc(nice(dueDate(p)))}${p.snooze && p.snooze === dueDate(p) ? ' (moved)' : ''}</dd>
    </dl>
    <div class="dact">
      ${fresh.has(p.id) ? `<button class="btn" type="button" data-undo="${p.id}">Undo watering</button>`
        : `<button class="btn primary" type="button" data-water="${p.id}"><svg aria-hidden="true"><use href="#i-drop"/></svg>Watered it today</button>`}
      <button class="btn" type="button" data-snooze="${p.id}" title="Soil still damp? Push the due date back a day.">Still damp, check tomorrow</button>
    </div>
    <div class="otherday"><label for="otherDate">Watered on another day:</label>
      <input type="date" id="otherDate" max="${todayISO()}" value="${addDays(todayISO(), -1)}">
      <button class="btn" type="button" data-waterdate="${p.id}">Log it</button></div>
    ${p.notes ? `<div class="sec"><h3>Notes</h3><p class="notes">${esc(p.notes)}</p></div>` : ''}
    <div class="sec"><h3>History</h3>
      ${hist.length ? `<ul class="hist">${hist.slice(0, 12).map((d,i) => `<li><span class="num">${esc(nice(d))}</span>
        <span>${gaps[i] != null ? `<span class="gap num${gaps[i] > p.every + 2 ? ' long' : ''}">after ${plural(gaps[i],'day')}</span>` : '<span class="gap">first logged</span>'}
        <button class="hist-rm" type="button" data-rmhist="${d}" aria-label="Remove watering on ${esc(nice(d))}">×</button></span></li>`).join('')}</ul>
        ${hist.length > 12 ? `<p class="rhythm">${hist.length - 12} older entries not shown.</p>` : ''}`
        : '<p class="rhythm">No waterings logged yet.</p>'}
      ${rhythm ? `<p class="rhythm">${esc(rhythm)}</p>` : ''}
    </div>
    <div class="dfoot"><button class="btn" type="button" data-edit="${p.id}">Edit plant</button><button class="btn quiet danger" type="button" data-del="${p.id}">Delete</button></div>
  </div>`;
  if (sheetOpen){ el.classList.add('open'); $('#scrim').classList.add('on'); }
}

function renderDatalists(){
  $('#dl-species').innerHTML = PRESETS.map(([n]) => `<option value="${esc(n)}">`).join('');
  const defaults = ['Living room','Kitchen','Bedroom','Bathroom','Office','Hallway','Balcony'];
  const rs = new Set([...state.plants.map(p => p.room).filter(Boolean), ...defaults]);
  $('#dl-rooms').innerHTML = [...rs].map(r => `<option value="${esc(r)}">`).join('');
}

/* ---------- sheet (mobile) ---------- */
const mq = matchMedia('(max-width:959px)');
function openPlant(id){
  selected = id; sheetOpen = mq.matches; render();
  if (mq.matches){ const n = $('#detail [data-close]'); if (n) n.focus(); }
}
function closeSheet(){
  sheetOpen = false; $('#detail').classList.remove('open'); $('#scrim').classList.remove('on');
  const b = selected && document.querySelector(`[data-open="${selected}"]`); if (b) b.focus();
}

/* ---------- form ---------- */
const dlg = $('#dlg'), pf = $('#pf');
let editing = null, everyTouched = false;
function openForm(id){
  editing = id || null; everyTouched = !!id;
  const p = state.plants.find(x => x.id === id);
  $('#dlgTitle').textContent = p ? `Edit ${p.name}` : 'Add a plant';
  $('#saveBtn').textContent = p ? 'Save changes' : 'Add plant';
  pf.name.value = p?.name || ''; pf.species.value = p?.species || ''; pf.room.value = p?.room || (room !== 'all' && room !== 'No room' ? room : '');
  pf.every.value = p?.every || 7; pf.last.value = p ? (p.last || '') : todayISO(); pf.last.max = todayISO();
  pf.notes.value = p?.notes || '';
  pf.last.closest('.field').querySelector('.hint').hidden = !!p;
  ['#f-name','#f-every','#f-last'].forEach(s => $(s).classList.remove('err'));
  $('#speciesHint').textContent = 'Pick one to get a starting schedule.';
  renderQuick();
  if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open','');
  pf.name.focus();
}
function renderQuick(){
  const v = Number(pf.every.value);
  $('#quickEvery').innerHTML = QUICK.map(n => `<button type="button" data-q="${n}" aria-pressed="${v === n}">${n} days</button>`).join('');
}
pf.every.addEventListener('input', () => { everyTouched = true; renderQuick(); });
$('#quickEvery').addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (!b) return; pf.every.value = b.dataset.q; everyTouched = true; renderQuick(); });
pf.species.addEventListener('input', () => {
  const m = PRESETS.find(([n]) => n.toLowerCase() === pf.species.value.trim().toLowerCase());
  if (m){
    if (!everyTouched){ pf.every.value = m[1]; renderQuick(); $('#speciesHint').textContent = `Set to every ${m[1]} days, a typical indoor start. Adjust to your home.`; }
    else $('#speciesHint').textContent = `Typical indoors: every ${m[1]} days.`;
    if (!pf.name.value.trim()) pf.name.placeholder = m[0];
  }
});
$('#cancelBtn').addEventListener('click', () => dlg.close());
pf.addEventListener('submit', e => {
  e.preventDefault();
  let name = pf.name.value.trim(); const species = pf.species.value.trim();
  if (!name && species) name = species;
  const every = Math.round(Number(pf.every.value)); const last = pf.last.value || null;
  let ok = true;
  $('#f-name').classList.toggle('err', !name); if (!name) ok = false;
  const badEvery = !(every >= 1 && every <= 120); $('#f-every').classList.toggle('err', badEvery); if (badEvery) ok = false;
  const badLast = last && last > todayISO(); $('#f-last').classList.toggle('err', !!badLast); if (badLast) ok = false;
  if (!ok){ pf.querySelector('.err input')?.focus(); return; }
  const data = { name, species, room: pf.room.value.trim(), every, notes: pf.notes.value.trim() };
  if (editing){
    const p = state.plants.find(x => x.id === editing);
    Object.assign(p, data);
    if (last !== p.last){ if (last && !p.history.includes(last)) p.history.push(last); p.history.sort(); p.last = last ? p.history.filter(d => d <= last).pop() : null; if (!last) p.history = []; p.snooze = null; }
  } else {
    const p = { id: uid(), ...data, last, snooze: null, history: last ? [last] : [], added: todayISO() };
    state.plants.push(p); selected = p.id;
  }
  save(); dlg.close(); render();
  const b = document.querySelector(`[data-open="${editing || selected}"]`); if (b) { b.focus(); b.scrollIntoView({block:'nearest'}); }
});

/* ---------- examples ---------- */
function examples(){
  const t = todayISO();
  const mk = (name, species, room, every, since, notes, jitter) => {
    const last = addDays(t, -since); const h = [last]; let d = last;
    for (let i = 0; i < 5; i++){ d = addDays(d, -(every + (jitter[i % jitter.length] || 0))); h.unshift(d); }
    return { id: uid(), name, species, room, every, notes, last, snooze: null, history: h, added: h[0] };
  };
  state.plants = [
    mk('Big Monty','Monstera deliciosa','Living room',7,7,'Wipe the leaves once a month. Water until it runs out of the bottom.',[0,1,-1]),
    mk('Fern by the shower','Boston fern','Bathroom',3,5,'Crisps fast if it dries out. Mist on hot days.',[0,1,0]),
    mk('Snake plant','Snake plant','Bedroom',14,3,'Only when the soil is dry all the way down.',[2,0,3]),
    mk('Peace lily','Peace lily','Kitchen',5,4,'Droops dramatically when thirsty, perks up within an hour.',[0,-1,1]),
    mk('Pothos on the shelf','Golden pothos','Office',7,5,'',[1,0,2]),
    mk('Orchid','Phalaenopsis orchid','Bathroom',8,8,'Soak the pot for 10 minutes, then drain. Never leave water in the crown.',[0,0,1]),
    mk('ZZ','ZZ plant','Hallway',18,10,'Low light corner. Overwatering is the only way to kill it.',[3,-2,4])
  ];
  selected = null; save(); render();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, .scrim'); if (!t) return;
  const d = t.dataset;
  if (t.id === 'scrim') return closeSheet();
  if (d.water) return water(d.water);
  if (d.undo) return undo(d.undo);
  if (d.open) return openPlant(d.open);
  if (d.snooze) return snooze(d.snooze);
  if (d.every) { const p = state.plants.find(x => x.id === selected); return p && setEvery(p.id, p.every + Number(d.every)); }
  if (d.waterdate){ const v = $('#otherDate').value; if (!v || v > todayISO()) return status('Pick a date that has already happened.'); water(d.waterdate, v); return status(`Logged a watering on ${nice(v)}.`); }
  if (d.rmhist) return removeHistory(selected, d.rmhist);
  if (d.edit) return openForm(d.edit);
  if (d.del) return del(d.del);
  if ('close' in d) return closeSheet();
  if ('add' in d) return openForm();
  if ('examples' in d) return examples();
  if (d.room){ room = d.room; return render(); }
  if (d.day){ dayFilter = dayFilter === d.day ? null : d.day; return render(); }
  if ('clearday' in d){ dayFilter = null; return render(); }
});
$('#addBtn').addEventListener('click', () => openForm());
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetOpen && !dlg.open) closeSheet(); });
mq.addEventListener?.('change', () => { sheetOpen = false; render(); });

$('#exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `soak-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  status(`Exported ${plural(state.plants.length,'plant')}.`);
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!s || !Array.isArray(s.plants)) throw new Error('shape');
    const clean = s.plants.filter(p => p && p.name && Number(p.every) > 0).map(p => ({
      id: String(p.id || uid()), name: String(p.name).slice(0,60), species: String(p.species || ''), room: String(p.room || ''),
      every: Math.min(120, Math.round(Number(p.every))), notes: String(p.notes || ''),
      history: (Array.isArray(p.history) ? p.history : []).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort(),
      last: null, snooze: /^\d{4}-\d{2}-\d{2}$/.test(p.snooze) ? p.snooze : null, added: p.added || todayISO() }));
    clean.forEach(p => { if (!p.history.length && /^\d{4}-\d{2}-\d{2}$/.test(s.plants.find(x=>x.id===p.id)?.last)) p.history = [s.plants.find(x=>x.id===p.id).last]; p.last = p.history[p.history.length-1] || null; });
    if (state.plants.length && !confirm(`Replace your ${plural(state.plants.length,'plant')} with the ${plural(clean.length,'plant')} in this backup?`)) return;
    state.plants = clean; selected = null; save(); render(); status(`Imported ${plural(clean.length,'plant')}.`);
  } catch(err){ status("Couldn't read that file. Choose a backup exported from Soak (.json)."); }
  e.target.value = '';
});

/* re-render at midnight / when returning to the tab so "today" stays true */
let lastDay = todayISO();
setInterval(() => { if (todayISO() !== lastDay){ lastDay = todayISO(); render(); } }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && todayISO() !== lastDay){ lastDay = todayISO(); render(); } });

load(); render();
if (!storageOK) status("This browser isn't letting Soak save. Changes last until you close the tab.");
})();
</script>
</body>
